version: "3.9"

services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ai-gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: ["uvicorn", "src.ai_gateway_tpm:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - redis

volumes:
  redis_data: